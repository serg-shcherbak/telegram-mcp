name: telegram-dot
services:
  telegram-mcp:
    image: ${TELEGRAM_DOT_IMAGE:?Set an immutable image tag built from the reviewed commit}
    env_file: /etc/telegram-dot/telegram.env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: '8765'
      DOT_EVENTS_ENABLED: '0'
      TELEGRAM_LEGACY_EVENTS: '0'
      TELEGRAM_WARM_ENTITY_CACHE: '0'
    ports: ['127.0.0.1:8765:8765']
    volumes:
      - /opt/telegram-dot/state/session:/app/session
      - /opt/telegram-dot/state/app:/app/state
    init: true
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.25
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
