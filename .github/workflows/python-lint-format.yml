name: Python Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Frozen lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.3'
      - run: uv sync --frozen --python 3.13.12
      - name: Reject fatal Python errors
        run: uv run --frozen --no-sync flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check formatting
        run: uv run --frozen --no-sync black --check .
