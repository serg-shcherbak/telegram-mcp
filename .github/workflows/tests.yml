name: Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Frozen tests, packages and clean installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the official bundle CLI
        run: npm install --prefix "$RUNNER_TEMP/mcpb" --ignore-scripts @anthropic-ai/mcpb@2.1.2
      - name: Install the frozen development environment
        run: uv sync --frozen --python 3.13.12
      - name: Build distributions with the locked build backend
        run: uv run --frozen --no-sync uv build --offline --no-build-isolation --out-dir "$RUNNER_TEMP/dist"
      - name: Run all tests including actual bundle packaging
        env:
          MCPB_TEST_CLI: ${{ runner.temp }}/mcpb/node_modules/.bin/mcpb
        run: uv run --frozen --no-sync pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Install the frozen production environment separately
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/dot-installed
        run: uv sync --frozen --python 3.13.12 --no-dev --no-editable
      - name: Exercise the installed authenticated profile without Telegram
        run: '"$RUNNER_TEMP/dot-installed/bin/python" -I tests/smoke_dot_install.py "$GITHUB_WORKSPACE/deploy/dot/dot_server.py"'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
