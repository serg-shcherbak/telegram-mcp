name: Docker Build & Compose Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Private Dot images and isolated smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.3'
      - run: uv sync --frozen --python 3.13.12
      - uses: docker/setup-buildx-action@v3
      - name: Build the private server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dot/Dockerfile
          build-args: VCS_REF=${{ github.sha }}
          tags: telegram-dot:ci
          load: true
          push: false
          cache-from: type=gha,scope=dot-server
          cache-to: type=gha,mode=max,scope=dot-server
      - name: Build the network-isolated converter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dot/Converter.Dockerfile
          build-args: VCS_REF=${{ github.sha }}
          tags: telegram-dot-converter:ci
          load: true
          push: false
          cache-from: type=gha,scope=dot-converter
          cache-to: type=gha,mode=max,scope=dot-converter
      - name: Inspect actual Docker context and resolved Compose restrictions
        env:
          DOT_DOCKER_TESTS: '1'
        run: uv run --frozen --no-sync pytest tests/test_packaging_security.py -q -k 'docker_context or compose_resolves'
      - name: Exercise the installed image without network or private mounts
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777,size=32m \
            --memory 384m --memory-swap 384m --cpus .25 --pids-limit 64 \
            --cap-drop ALL --security-opt no-new-privileges:true -i \
            --entrypoint python telegram-dot:ci -I - /opt/telegram-dot/dot_server.py \
            < tests/smoke_dot_install.py
      - name: Check converter runtime identity and decoder
        run: |
          docker run --rm --network none --read-only --entrypoint python telegram-dot-converter:ci \
            -c 'import os, subprocess; assert os.getuid() == 1000; subprocess.run(["ffmpeg", "-version"], check=True, stdout=subprocess.DEVNULL)'
